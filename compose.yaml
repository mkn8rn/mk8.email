name: mk8-email

services:
  database:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mk8email
      POSTGRES_USER: mk8email
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mk8email -d mk8email"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mail:
    image: mk8.email:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      MK8EMAIL_CONFIG_FILE: /run/secrets/mk8email_config
    secrets:
      - mk8email_config
      - database_password
      - superadmin_password
      - tls_certificate
      - tls_private_key
      - dkim_private_key
    ports:
      - "25:2525"
      - "587:2587"
      - "465:2465"
      - "993:2993"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 30s
    networks:
      - backend
      - edge
    logging:
      options:
        max-size: 10m
        max-file: "3"

secrets:
  mk8email_config:
    file: ./deploy/mk8email.config.json
  database_password:
    file: ./deploy/secrets/database_password
  superadmin_password:
    file: ./deploy/secrets/superadmin_password
  tls_certificate:
    file: ./deploy/secrets/tls_certificate.pem
  tls_private_key:
    file: ./deploy/secrets/tls_private_key.pem
  dkim_private_key:
    file: ./deploy/secrets/dkim_private_key.pem

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  edge:
