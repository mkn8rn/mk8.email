server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log mk8_safe;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.mk8n.com mta-sts.mk8n.com autoconfig.mk8n.com matrix.mkn8rn.com;
    access_log /var/log/nginx/access.log mk8_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/access.log mk8_safe;
    ssl_certificate /etc/mk8email/tls/fullchain.pem;
    ssl_certificate_key /etc/mk8email/tls/privkey.pem;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matrix.mkn8rn.com;
    access_log /var/log/nginx/access.log mk8_safe;
    error_log /var/log/nginx/matrix-error.log emerg;

    ssl_certificate /etc/matrix-synapse/tls/fullchain.pem;
    ssl_certificate_key /etc/matrix-synapse/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 100M;

    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server":"matrix.mkn8rn.com:443"}';
    }

    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.mkn8rn.com"}}';
    }

    location ~ ^/(?:_matrix(?:/|$)|_synapse/client(?:/|$)) {
        limit_req zone=matrix_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.mk8n.com;
    access_log /var/log/nginx/access.log mk8_safe;

    ssl_certificate /etc/mk8email/tls/fullchain.pem;
    ssl_certificate_key /etc/mk8email/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mta-sts.mk8n.com;
    access_log /var/log/nginx/access.log mk8_safe;

    ssl_certificate /etc/mk8email/tls/fullchain.pem;
    ssl_certificate_key /etc/mk8email/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /.well-known/mta-sts.txt {
        root /var/www/mta-sts;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autoconfig.mk8n.com;
    access_log /var/log/nginx/access.log mk8_safe;

    ssl_certificate /etc/mk8email/tls/fullchain.pem;
    ssl_certificate_key /etc/mk8email/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /mail/config-v1.1.xml {
        root /var/www/autoconfig;
        default_type application/xml;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
