[Unit]
After=postgresql.service
Wants=postgresql.service
ConditionPathExists=/etc/mk8email/mail-stack-ready
RequiresMountsFor=/var/vmail

[Service]
NoNewPrivileges=true
KeyringMode=private
MemoryDenyWriteExecute=true
PrivateDevices=true
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectProc=invisible
ProtectSystem=strict
ProcSubset=pid
RemoveIPC=true
RuntimeDirectory=dovecot
RuntimeDirectoryMode=0755
ReadWritePaths=-/run/dovecot -/var/lib/dovecot -/var/spool/postfix/private /var/vmail
NoExecPaths=/var/vmail /var/lib/dovecot /tmp
RestrictAddressFamilies=AF_UNIX AF_INET
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
SystemCallFilter=~@clock @cpu-emulation @debug @module @obsolete @raw-io @reboot @swap
UMask=0077
