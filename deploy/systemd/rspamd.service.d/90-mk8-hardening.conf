[Unit]
After=network-online.target valkey-server.service clamav-daemon.service
Wants=network-online.target valkey-server.service clamav-daemon.service
ConditionPathExists=/etc/mk8email/mail-stack-ready

[Service]
Restart=on-failure
RestartSec=5s
KillMode=mixed
TimeoutStopSec=20s
NoNewPrivileges=true
PrivateDevices=true
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectProc=invisible
ProtectSystem=strict
ProcSubset=pid
ReadWritePaths=/run/rspamd /var/lib/rspamd /var/log/rspamd
NoExecPaths=/run/rspamd /var/lib/rspamd /var/log/rspamd /tmp
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
UMask=0077
