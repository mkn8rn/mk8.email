rules {
  ANTIVIRUS_UNAVAILABLE {
    action = "soft reject";
    expression = "CLAM_VIRUS_FAIL";
    message = "The malware scanner is temporarily unavailable";
  }
  ENCRYPTED_ATTACHMENT {
    action = "reject";
    expression = "CLAM_VIRUS_ENCRYPTED";
    message = "Encrypted attachments are not accepted";
  }
  OFFICE_MACRO {
    action = "reject";
    expression = "CLAM_VIRUS_MACRO";
    message = "Office macro attachments are not accepted";
  }
}
