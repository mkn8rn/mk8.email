dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = 0.0.0.0
base_dir = /run/dovecot
login_greeting = email.mk8n.com ready.
shutdown_clients = yes

auth_mechanisms = plain
auth_allow_cleartext = no
auth_allow_weak_schemes = no
auth_username_format = %{user | lower}
auth_failure_delay = 3 secs
auth_cache_size = 10M
auth_cache_ttl = 1 hours
auth_cache_negative_ttl = 1 mins

ssl = required
ssl_server_cert_file = /etc/mk8email/tls/fullchain.pem
ssl_server_key_file = /etc/mk8email/tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_server_prefer_ciphers = client

mail_uid = vmail
mail_gid = vmail
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/mail
mail_fsync = always
mailbox_list_index = yes
mail_max_userip_connections = 20
first_valid_uid = 5000
last_valid_uid = 5000

mail_plugins {
  quota = yes
}

quota "User quota" {
  driver = count
  storage_size = 10G
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
    quota_storage_extra = 100M
  }
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 2
  process_limit = 100
  service_restart_request_count = 1
  vsz_limit = 256M
}

service imap {
  process_limit = 100
  vsz_limit = 512M
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
  process_limit = 20
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  user = dovecot
  process_limit = 1
}

service auth-worker {
  user = dovecot
  process_limit = 10
}

sql_driver = pgsql
pgsql /run/postgresql {
  parameters {
    user = dovecot
    dbname = mk8email
  }
}

passdb sql {
  default_password_scheme = BLF-CRYPT
  query = SELECT i.name AS username, a.domain, u.password_hash AS password FROM inboxes i JOIN addresses a ON a.id = i.address_id JOIN companies c ON c.id = a.company_id JOIN users u ON u.id = i.owner_id WHERE i.name = '%{user | username}' AND a.domain = '%{user | domain}' AND i.alias_for_inbox_id IS NULL AND a.is_active AND c.is_active AND u.is_active
}

userdb sql {
  query = SELECT 5000 AS uid, 5000 AS gid, '/var/vmail/' || a.domain || '/' || i.name AS home, CASE WHEN u.quota_bytes > 0 THEN u.quota_bytes::text || 'B' ELSE '10G' END AS quota_storage_size FROM inboxes i JOIN addresses a ON a.id = i.address_id JOIN companies c ON c.id = a.company_id JOIN users u ON u.id = i.owner_id WHERE i.name = '%{user | username}' AND a.domain = '%{user | domain}' AND i.alias_for_inbox_id IS NULL AND a.is_active AND c.is_active AND u.is_active
  iterate_query = SELECT i.name AS username, a.domain FROM inboxes i JOIN addresses a ON a.id = i.address_id JOIN companies c ON c.id = a.company_id JOIN users u ON u.id = i.owner_id WHERE i.alias_for_inbox_id IS NULL AND a.is_active AND c.is_active AND u.is_active
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

protocol lmtp {
  postmaster_address = admin@mk8n.com
}
